<header class="site-header">
  <div class="container">
    <div class="site-brand">
      <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <p class="site-subtitle">artisanal ramblings about code, written by a human</p>
    </div>
    <nav class="site-nav">
      <div class="nav-left">
        <a href="{{ "posts" | relURL }}">Posts</a>
        <a href="{{ "about" | relURL }}">About</a>
      </div>
      <div class="nav-right">
        {{ with .Site.Params.github }}
          <a class="nav-rss" href="{{ . }}" rel="me noopener" target="_blank" aria-label="GitHub">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.52 7.52 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
              </svg>
            </span>
            <span>GitHub</span>
          </a>
        {{ end }}
        {{ with .Site.Home.OutputFormats.Get "rss" }}
          <a class="nav-rss" href="{{ .RelPermalink }}" aria-label="RSS feed">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="18" r="1.6"></circle>
                <path d="M4 10a8 8 0 0 1 8 8"></path>
                <path d="M4 4a14 14 0 0 1 14 14"></path>
              </svg>
            </span>
            <span>RSS</span>
          </a>
        {{ end }}
        <button class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="icon icon-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="M4.93 4.93l1.41 1.41"></path>
              <path d="M17.66 17.66l1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="M4.93 19.07l1.41-1.41"></path>
              <path d="M17.66 6.34l1.41-1.41"></path>
            </svg>
          </span>
          <span class="icon icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
            </svg>
          </span>
        </button>
      </div>
    </nav>
  </div>
</header>
