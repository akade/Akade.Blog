{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ range .Pages }}
    <article class="post-item">
      <a class="post-item-link" href="{{ .RelPermalink }}">
        <h2>{{ .Title }}</h2>
        {{ partial "post-meta.html" . }}
        <p>{{ .Summary }}</p>
      </a>
    </article>
  {{ end }}
{{ end }}
